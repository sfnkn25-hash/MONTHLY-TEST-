<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Markazi Jamiatul Madina</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
        .header { background-color: #1a5d2e; color: white; text-align: center; padding: 20px 10px; }
        .header h1 { margin: 0; font-size: 24px; }
        .header p { margin: 5px 0 0 0; font-size: 14px; opacity: 0.9; }
        .container { max-width: 600px; margin: 20px auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; font-size: 16px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; background: #e0e0e0; color: #333; }
        .tab-btn.active { background: #1a5d2e; color: white; }
        h3 { text-align: center; color: #1a5d2e; margin-bottom: 20px; }
        label { font-weight: bold; color: #444; font-size: 14px; display: block; margin-top: 15px; }
        select, input, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        .btn-action { background-color: #1a5d2e; color: white; width: 100%; padding: 15px; margin-top: 20px; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn-action:disabled { background-color: #888; }
        #errorMsg { color: red; text-align: center; font-weight: bold; margin-top: 15px; }
        #resultCard { display: none; margin-top: 30px; border: 2px solid #1a5d2e; border-radius: 8px; overflow: hidden; }
        .card-header { background-color: #1a5d2e; color: white; text-align: center; padding: 15px; font-weight: bold; font-size: 18px; }
        .student-info { padding: 15px; background: #e8f5e9; display: flex; align-items: center; gap: 15px; }
        .student-photo { width: 80px; height: 100px; border-radius: 5px; border: 2px solid #1a5d2e; object-fit: cover; }
        .info-text p { margin: 5px 0; font-size: 15px; color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 0; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #1a5d2e; color: white; }
        .chat-box { background: #fdfbf7; padding: 15px; border-radius: 8px; margin-top: 15px; min-height: 100px; border: 2px solid #1a5d2e; }
        .ai-reply { font-size: 16px; color: #1a5d2e; line-height: 1.6; white-space: pre-wrap; font-family: Georgia, serif; }
        .urdu-text { font-size: 20px; color: #1a5d2e; text-align: center; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Markazi Jamiatul Madina</h1>
        <p>Student Result & Deeni Rehnumai Portal</p>
    </div>
    <div class="container">
        <div class="tab-buttons">
            <button class="tab-btn active" id="tabResult" onclick="switchTab('result')">📝 Result</button>
            <button class="tab-btn" id="tabChat" onclick="switchTab('chat')">🕌 Sawal O Jawab</button>
        </div>

        <!-- RESULT SECTION -->
        <div id="sectionResult">
            <h3>Check Your Result</h3>
            <label>Select Month (Mahina):</label>
            <select id="searchMonth" required>
                <option value="">Select Month</option>
                <option value="January">January</option>
                <option value="February">February</option>
                <option value="March">March</option>
                <option value="April">April</option>
                <option value="May">May</option>
                <option value="June">June</option>
                <option value="July">July</option>
                <option value="August">August</option>
                <option value="September">September</option>
                <option value="October">October</option>
                <option value="November">November</option>
                <option value="December">December</option>
            </select>

            <label>Dakhila Number (Roll No):</label>
            <input type="text" id="searchDakhila" placeholder="Dakhila No. type karein">

            <button class="btn-action" id="searchBtn" onclick="fetchResult()">Get Result</button>
            <p id="errorMsg"></p>

            <div id="resultCard">
                <div class="card-header">Monthly Test Result - <span id="resMonth"></span></div>
                <div class="student-info">
                    <img id="resPhoto" class="student-photo" src="https://via.placeholder.com/80x100?text=No+Photo" alt="Photo">
                    <div class="info-text">
                        <p><b>Name:</b> <span id="resName"></span></p>
                        <p><b>Dakhila No:</b> <span id="resDakhila"></span></p>
                        <p><b>Class:</b> <span id="resClass"></span></p>
                    </div>
                </div>
                <table>
                    <thead><tr><th>Subject</th><th>Max</th><th>Pass</th><th>Obtained</th></tr></thead>
                    <tbody id="marksTableBody"></tbody>
                </table>
                <div style="padding: 15px; background: #fff3cd; text-align: center; font-weight: bold; color: #856404;" id="resTotal"></div>
            </div>
        </div>

        <!-- SAWAL O JAWAB SECTION -->
        <div id="sectionChat" style="display: none;">
            <div class="urdu-text">صلّو علی الحبیب! صلی اللہ تعالٰی علٰی محمد</div>
            
            <h3 style="margin-top:10px;">Deeni Masail - Sawal O Jawab</h3>
            <label>Apna Masla ya Sawal type karein:</label>
            <textarea id="aiQuestion" rows="4" placeholder="Sawal yahan likhein..."></textarea>
            
            <button class="btn-action" id="askBtn" onclick="askAI()">Sawal Bhejein</button>
            
            <div class="chat-box" id="chatResponseBox" style="display:none;">
                <b>🕌 AI Mufti Sahab:</b>
                <p class="ai-reply" id="aiReplyText"></p>
            </div>
        </div>
    </div>

    <script>
        // Aapka Google Sheet ka API Link (Fix hai)
        const API_URL = "https://script.google.com/macros/s/AKfycbx3-d4LwAvGZFcyILBxxMLzRZ6s-4XFwvjSVzNewbWpkFuaT1-Q0SmbVZR7Wtv7gCE/exec"; 

        function switchTab(tab) {
            document.getElementById('sectionResult').style.display = tab === 'result' ? 'block' : 'none';
            document.getElementById('sectionChat').style.display = tab === 'chat' ? 'block' : 'none';
            document.getElementById('tabResult').className = tab === 'result' ? 'tab-btn active' : 'tab-btn';
            document.getElementById('tabChat').className = tab === 'chat' ? 'tab-btn active' : 'tab-btn';
        }

        function fetchResult() {
            const month = document.getElementById('searchMonth').value;
            const dakhila = document.getElementById('searchDakhila').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            
            if(!dakhila) { errorMsg.innerText = "Please Dakhila Number daalein."; return; }
            errorMsg.innerText = "🔍 Result dhoondh raha hai...";
            document.getElementById('resultCard').style.display = "none";
            
            fetch(API_URL)
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    const student = data.data.find(s => s.Dakhila == dakhila && s.Month == month);
                    if(student) {
                        errorMsg.innerText = "";
                        showResult(student);
                    } else {
                        errorMsg.innerText = `Bhai, is mahine ka result nahi mila.`;
                    }
                }
            }).catch(e => { errorMsg.innerText = "Internet ka masla hai, dobara koshish karein."; });
        }

        function showResult(data) {
            document.getElementById('resMonth').innerText = data.Month;
            document.getElementById('resName').innerText = data.Name;
            document.getElementById('resDakhila').innerText = data.Dakhila;
            document.getElementById('resClass').innerText = data.Class;
            document.getElementById('resPhoto').src = data.Photo || "https://via.placeholder.com/80x100?text=No+Photo";
            
            const tbody = document.getElementById('marksTableBody');
            tbody.innerHTML = "";
            let totalMax = 0, totalObt = 0;
            let subjects = JSON.parse(data.Subjects || "[]");

            subjects.forEach(sub => {
                totalMax += parseInt(sub.max) || 0;
                totalObt += parseInt(sub.obt) || 0;
                const isFail = parseInt(sub.obt) < parseInt(sub.pass);
                tbody.innerHTML += `<tr><td>${sub.name}</td><td>${sub.max}</td><td>${sub.pass}</td><td style="${isFail ? 'color:red;font-weight:bold;' : ''}">${sub.obt}</td></tr>`;
            });
            document.getElementById('resTotal').innerHTML = `Total Marks: ${totalObt} / ${totalMax} <br> Percentage: ${((totalObt / totalMax) * 100).toFixed(2)}%`;
            document.getElementById('resultCard').style.display = "block";
        }

        function askAI() {
            const question = document.getElementById('aiQuestion').value.trim();
            if(!question) return;
            
            const btn = document.getElementById('askBtn');
            const replyText = document.getElementById('aiReplyText');
            document.getElementById('chatResponseBox').style.display = 'block';
            
            btn.disabled = true;
            btn.innerText = "⏳ Jawab aa raha hai...";
            replyText.innerText = "Thoda intezar karein. Darood e paak padhte rahiye...";

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: "chat", message: question })
            })
            .then(res => res.json())
            .then(data => {
                btn.disabled = false;
                btn.innerText = "Sawal Bhejein";
                if(data.reply) {
                    replyText.innerText = data.reply;
                } else {
                    replyText.innerText = "Jawab dhoondhne mein masla hua.";
                }
            })
            .catch(err => {
                btn.disabled = false;
                btn.innerText = "Sawal Bhejein";
                replyText.innerText = "Internet ka masla hai. Dobara koshish karein.";
            });
        }
    </script>
</body>
</html>
