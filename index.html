   <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Markazi Jamiatul Madina</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f1; margin: 0; padding: 15px; }
        .container { max-width: 650px; background: white; padding: 25px; margin: 0 auto; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a5d2e; border-bottom: 3px solid #1a5d2e; padding-bottom: 10px; margin-top: 0; }
        
        /* Search Box Style */
        .search-box { background: #e8f5e9; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #c8e6c9; }
        .search-box h4 { margin: 0 0 10px 0; color: #2e7d32; font-size: 16px; }
        .btn-search { background: #ff9800; color: white; padding: 10px; border: none; border-radius: 5px; width: 100%; margin-top: 10px; cursor: pointer; font-weight: bold; }
        
        /* Form Style */
        label { font-weight: bold; margin-top: 15px; display: block; color: #444; font-size: 14px; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 15px; }
        input:focus, select:focus { border-color: #1a5d2e; outline: none; }
        
        /* Books Section */
        .books-container { margin-top: 20px; border: 2px dashed #1a5d2e; padding: 15px; border-radius: 8px; background: #fafafa; }
        .book-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .book-row input { margin-top: 0; padding: 8px; font-size: 14px; text-align: center; }
        .b-name { flex: 2; text-align: left !important; }
        .b-max, .b-pass { flex: 1; }
        .b-obt { flex: 1.5; border: 1.5px solid #1a5d2e !important; background: #e8f5e9; font-weight: bold; }
        
        .btn-add { background: #007bff; color: white; padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 15px; display: inline-block; }
        .btn-remove { background: #dc3545; color: white; border: none; padding: 0 12px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        
        .btn-submit { background: #1a5d2e; color: white; width: 100%; padding: 15px; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; margin-top: 25px; font-weight: bold; }
        .btn-submit:hover { background: #144923; }
        .message { text-align: center; margin-top: 15px; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Admin Portal - Result Entry</h2>

    <!-- Naya Feature: Purana Result Check Karne Ka Section -->
    <div class="search-box">
        <h4>🔍 Pehle Se Uploaded Result Check Karein</h4>
        <input type="text" id="searchDakhila" placeholder="Dakhila Number Daalein...">
        <button type="button" class="btn-search" onclick="searchStudent()">Check Result Status</button>
        <p id="searchMsg" style="font-size: 14px; margin-bottom: 0; margin-top: 10px; text-align: center;"></p>
    </div>

    <!-- Result Entry Form -->
    <form id="adminForm">
        <label>Select Month (Mahina):</label>
        <select id="month" required>
            <option value="January">January</option>
            <option value="February">February</option>
            <option value="March">March</option>
            <option value="April">April</option>
            <option value="May">May</option>
            <option value="June">June</option>
            <option value="July">July</option>
            <option value="August">August</option>
            <option value="September" selected>September</option>
            <option value="October">October</option>
            <option value="November">November</option>
            <option value="December">December</option>
        </select>

        <label>Class (Darja):</label>
        <select id="class" required onchange="loadClassTemplate()">
            <option value="">-- Select Class --</option>
            <option value="Hifz">Hifz</option>
            <option value="I'dadia">I'dadia</option>
            <option value="Ula">Ula</option>
            <option value="Sania">Sania</option>
            <option value="Salisa">Salisa</option>
            <option value="Rabia">Rabia</option>
            <option value="Khamisa">Khamisa</option>
            <option value="Sadisa">Sadisa</option>
            <option value="Sabiya">Sabiya</option>
            <option value="Dora-e-Hadith">Dora-e-Hadith</option>
        </select>
        <small style="color: gray; display: block; margin-top: 3px;">Class select karte hi purani kitabein auto-load ho jayengi.</small>

        <label>Dakhila Number (Roll No):</label>
        <input type="text" id="dakhila" placeholder="Maslan: 9119-003307" required>

        <label>Student Name (Naam):</label>
        <input type="text" id="name" placeholder="Bacche ka naam" required>

        <label>Student Photo URL (Link):</label>
        <input type="url" id="photo" placeholder="Photo ka link daalein (Optional)">

        <div class="books-container">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <label style="margin-top: 0;">📚 Subject Marks (Kitabon ke Number)</label>
                <button type="button" class="btn-add" onclick="addBook()">+ Add Book</button>
            </div>
            
            <!-- Table Header jaisa look -->
            <div style="display:flex; gap:8px; margin-bottom:5px; text-align:center; font-size:12px; font-weight:bold; color:#555;">
                <div style="flex:2; text-align:left;">Book Name</div>
                <div style="flex:1">Total</div>
                <div style="flex:1">Pass</div>
                <div style="flex:1.5; color:#1a5d2e;">Obtained</div>
                <div style="width:35px;"></div>
            </div>

            <div id="booksList">
                <!-- Kitabein yahan aayengi -->
            </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">💾 Save Result to Internet</button>
        <p id="msg" class="message"></p>
    </form>
</div>

<script>
    // AAPKA ASLI APPS SCRIPT URL
    const API_URL = "https://script.google.com/macros/s/AKfycbx3-d4LwAvGZFcyILBxxMLzRZ6s-4XFwvjSVzNewbWpkFuaT1-Q0SmbVZR7Wtv7gCE/exec"; 

    // Book add karne ka naya function (Jo auto-fill support karta hai)
    function addBook(name='', max='100', pass='40', obt='') {
        const list = document.getElementById("booksList");
        const row = document.createElement("div");
        row.className = "book-row";
        row.innerHTML = `
            <input type="text" class="b-name" placeholder="Book Name" value="${name}" required>
            <input type="number" class="b-max" placeholder="100" value="${max}" required>
            <input type="number" class="b-pass" placeholder="40" value="${pass}" required>
            <input type="number" class="b-obt" placeholder="Marks" value="${obt}" required>
            <button type="button" class="btn-remove" onclick="this.parentElement.remove()">X</button>
        `;
        list.appendChild(row);
    }

    // =====================================
    // SMART MEMORY FUNCTIONS
    // =====================================
    function loadClassTemplate() {
        const cls = document.getElementById('class').value.trim().toLowerCase();
        const list = document.getElementById("booksList");
        
        if(!cls) {
            list.innerHTML = '';
            addBook();
            return;
        }

        const savedData = localStorage.getItem('classData_' + cls);
        if(savedData) {
            list.innerHTML = ''; // Purani list mitao
            const books = JSON.parse(savedData);
            books.forEach(b => addBook(b.name, b.max, b.pass, '')); // Obtained marks khali chhod do
        } else {
            list.innerHTML = '';
            addBook();
        }
    }

    function saveCurrentClassTemplate() {
        const cls = document.getElementById('class').value.trim().toLowerCase();
        if(!cls) return;

        const books = document.querySelectorAll('.book-row');
        const booksArray = [];
        books.forEach(b => {
            booksArray.push({
                name: b.querySelector('.b-name').value,
                max: b.querySelector('.b-max').value,
                pass: b.querySelector('.b-pass').value
            });
        });
        
        localStorage.setItem('classData_' + cls, JSON.stringify(booksArray));
    }

    // =====================================
    // DATA SAVE KARNE KA FUNCTION
    // =====================================
    document.getElementById('adminForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        const msg = document.getElementById('msg');
        btn.innerText = "⏳ Saving Data...";
        btn.disabled = true;
        msg.innerText = "";

        // Memory mein kitabein save karo
        saveCurrentClassTemplate();

        // Data ikattha karo
        const books = document.querySelectorAll('.book-row');
        let subjectsData = [];
        books.forEach(b => {
            subjectsData.push({
                name: b.querySelector('.b-name').value,
                max: b.querySelector('.b-max').value,
                pass: b.querySelector('.b-pass').value,
                obt: b.querySelector('.b-obt').value
            });
        });

        const data = {
            "action": "add", // Backend AI ko batane ke liye
            "Month": document.getElementById('month').value,
            "Dakhila": document.getElementById('dakhila').value,
            "Name": document.getElementById('name').value,
            "Class": document.getElementById('class').value,
            "Photo": document.getElementById('photo').value,
            "Subjects": JSON.stringify(subjectsData)
        };

        fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(data)
        }).then(() => {
            msg.style.color = "green";
            msg.innerText = "✅ Result Online Save Ho Gaya!";
            btn.innerText = "💾 Save Result to Internet";
            btn.disabled = false;
            
            // YAHAN JADU HAI: Sirf Naam aur Dakhila khali karna hai (Poora form reset nahi karna)
            document.getElementById('name').value = '';
            document.getElementById('dakhila').value = '';
            
            // Kitabon ke marks khali karne ke liye class ko reload karwa lo
            loadClassTemplate(); 
            
            setTimeout(() => msg.innerText = "", 5000);
        }).catch(err => {
            msg.style.color = "red";
            msg.innerText = "❌ Internet ka masla hai ya data theek nahi gaya.";
            btn.innerText = "💾 Save Result to Internet";
            btn.disabled = false;
        });
    });

    // =====================================
    // SEARCH STUDENT FUNCTION (Aapka purana)
    // =====================================
    function searchStudent() {
        const searchVal = document.getElementById('searchDakhila').value;
        const searchMsg = document.getElementById('searchMsg');
        
        if(!searchVal) {
            searchMsg.innerText = "⚠️ Pehle Dakhila Number daalein.";
            searchMsg.style.color = "red";
            return;
        }

        searchMsg.innerText = "⏳ Dhoondh raha hai...";
        searchMsg.style.color = "blue";

        fetch(API_URL)
        .then(res => res.json())
        .then(data => {
            if(data.status === "success") {
                const student = data.data.find(s => s.Dakhila == searchVal);
                if(student) {
                    searchMsg.innerHTML = `✅ <b>${student.Name}</b> (Class: ${student.Class}) ka result pehle se sheet mein maujood hai.`;
                    searchMsg.style.color = "green";
                } else {
                    searchMsg.innerText = "❌ Is Dakhila number ka koi result nahi mila. Aap naya form bhar sakte hain.";
                    searchMsg.style.color = "red";
                }
            }
        })
        .catch(err => {
            searchMsg.innerText = "❌ Check karne mein masla aaya. Link check karein.";
            searchMsg.style.color = "red";
        });
    }

    // Shuru hote hi ek khali row daal do
    addBook();
</script>

</body>
</html>
