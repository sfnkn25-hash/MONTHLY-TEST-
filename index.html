<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madarsa Admin Panel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; margin: 0; padding: 0; }
        .nav { background-color: #1b5e20; padding: 10px; text-align: center; display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
        .nav button { background-color: white; color: #1b5e20; border: none; padding: 8px 15px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .nav button:hover { background-color: #e8f5e9; }
        .container { max-width: 900px; margin: 15px auto; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); box-sizing: border-box; width: 100%; }
        .hidden { display: none; }
        input, select { padding: 10px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; width: 100%; }
        .btn-submit { background-color: #1b5e20; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; width: 100%; font-size: 16px; margin-top: 15px; }
        .btn-fetch { background-color: #f57c00; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 5px; font-weight: bold; margin-bottom: 15px; }
        .btn-add-row { background-color: #0288d1; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 5px; margin-bottom: 15px; }
        .btn-remove-row { background-color: #d32f2f; color: white; border: none; padding: 8px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .subject-row { display: flex; gap: 10px; align-items: center; background: #f9f9f9; padding: 10px; border-radius: 5px; margin-bottom: 10px; border: 1px solid #ddd; }
        .subject-row input { margin: 0; }
        .sub-name { flex: 2; }
        .sub-num { flex: 1; }
        .table-responsive { width: 100%; overflow-x: auto; margin-bottom: 15px; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; font-size: 14px; }
        th { background-color: #e8f5e9; color: #1b5e20; }
        .loading { text-align: center; font-weight: bold; color: #f57c00; }
    </style>
</head>
<body>
    <div class="nav">
        <button onclick="showSection('adminSection')">Admin Data Entry</button>
        <button onclick="showSection('top10Section')">Top 10 Students</button>
    </div>

    <div id="adminSection" class="container">
        <h2 style="color: #1b5e20;">Add / Edit Result (Online)</h2>
        <label>Select Month for Result Entry:</label>
        <select id="inpMonth">
            <option value="January">January</option><option value="February">February</option><option value="March">March</option>
            <option value="April">April</option><option value="May">May</option><option value="June">June</option>
            <option value="July">July</option><option value="August">August</option><option value="September">September</option>
            <option value="October">October</option><option value="November">November</option><option value="December">December</option>
        </select>
        <div style="display: flex; gap: 10px; align-items: baseline;">
            <div style="flex: 1;">
                <label>Dakhila Number:</label>
                <input type="text" id="inpDakhila" placeholder="e.g. 101">
            </div>
            <button class="btn-fetch" id="fetchBtn" onclick="fetchStudentForEdit()">Fetch Student</button>
        </div>
        <p id="adminStatus" class="loading"></p>
        
        <label>Student Name:</label>
        <input type="text" id="inpName" placeholder="Student Name">
        <label>Class (Darja):</label>
        <select id="inpClass" onchange="loadClassBooks()">
            <option value="">-- Select Class --</option>
            <option value="IBTIDAYA MAKKI">IBTIDAYA MAKKI</option><option value="IBTIDAYA MADANI">IBTIDAYA MADANI</option>
            <option value="AWWAL">AWWAL</option><option value="DUWAM">DUWAM</option><option value="ULA">ULA</option>
            <option value="SANIYA">SANIYA</option><option value="SALISA">SALISA</option><option value="RABIA">RABIA</option>
        </select>
        <label>Student Photo URL (Link):</label>
        <input type="text" id="inpPhoto" placeholder="https://link-to-photo.jpg (Optional)">
        <hr style="border: 1px solid #ddd; margin: 20px 0;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin: 0; color: #1b5e20;">Subject Marks</h3>
            <button class="btn-add-row" onclick="addSubjectRow()">➕ Add Book</button>
        </div>
        <div id="subjectsContainer"></div>
        <button class="btn-submit" id="saveBtn" onclick="saveStudent()">💾 Save Result to Internet</button>
    </div>

    <div id="top10Section" class="container hidden">
        <h2 style="color: #1b5e20; text-align:center;">Top 10 Students (Local Memory)</h2>
        <label>Select Month:</label>
        <select id="top10Month" onchange="loadTop10()">
            <option value="January">January</option><option value="February">February</option><option value="March">March</option>
            <option value="April">April</option><option value="May">May</option><option value="June">June</option>
            <option value="July">July</option><option value="August">August</option><option value="September">September</option>
            <option value="October">October</option><option value="November">November</option><option value="December">December</option>
        </select>
        <div class="table-responsive">
            <table>
                <thead><tr><th>Rank</th><th>Dakhila</th><th>Name</th><th>Class</th><th>Obtained</th><th>%</th></tr></thead>
                <tbody id="top10Body"></tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzdbPgqKaLdG_e1NI0UkwTtX3YaN2O35_EBodgFxcwulVC4x2BFZR892mpZjbZZbwCc/exec";

        function showSection(sectionId) {
            document.querySelectorAll('.container').forEach(el => el.classList.add('hidden'));
            document.getElementById(sectionId).classList.remove('hidden');
            if(sectionId === 'top10Section') loadTop10();
            if(sectionId === 'adminSection' && document.getElementById('subjectsContainer').innerHTML.trim() === "") addSubjectRow();
        }

        function addSubjectRow(name = "", tot = 100, pass = 33, obt = "") {
            const container = document.getElementById('subjectsContainer');
            const row = document.createElement('div');
            row.className = 'subject-row';
            row.innerHTML = `<input type="text" class="sub-name" placeholder="Book Name" value="${name}"><input type="number" class="sub-tot sub-num" placeholder="Total" value="${tot}"><input type="number" class="sub-pass sub-num" placeholder="Passing" value="${pass}"><input type="number" class="sub-obt sub-num" placeholder="Obtained" value="${obt}"><button class="btn-remove-row" onclick="this.parentElement.remove()">❌</button>`;
            container.appendChild(row);
        }

        function loadClassBooks() {
            let selectedClass = document.getElementById('inpClass').value;
            let classDB = JSON.parse(localStorage.getItem('madarsaClassBooks')) || {};
            if(classDB[selectedClass] && classDB[selectedClass].length > 0) {
                document.getElementById('subjectsContainer').innerHTML = ''; 
                classDB[selectedClass].forEach(book => addSubjectRow(book.name, book.tot, book.pass, "")); 
            } else {
                document.getElementById('subjectsContainer').innerHTML = '';
                addSubjectRow(); 
            }
        }

        async function fetchStudentForEdit() {
            let dakhila = document.getElementById('inpDakhila').value;
            let month = document.getElementById('inpMonth').value;
            if(!dakhila) return alert("Pehle Dakhila Number likhein!");

            document.getElementById('adminStatus').innerText = "Internet se record dhoondh raha hai... ⏳";
            document.getElementById('fetchBtn').disabled = true;

            try {
                let res = await fetch(API_URL + "?dakhila=" + dakhila);
                let data = await res.json();
                
                if(data.error) {
                    alert("Ye naya Dakhila Number hai. Details bhariye aur class chuniye.");
                    document.getElementById('subjectsContainer').innerHTML = '';
                    addSubjectRow();
                } else {
                    let st = data;
                    document.getElementById('inpName').value = st.name;
                    document.getElementById('inpClass').value = st.class;
                    document.getElementById('inpPhoto').value = st.photo === 'https://via.placeholder.com/100?text=Photo' ? '' : st.photo;
                    document.getElementById('subjectsContainer').innerHTML = '';
                    if(st.monthlyRecords && st.monthlyRecords[month]) {
                        st.monthlyRecords[month].marks.forEach(m => addSubjectRow(m.name, m.tot, m.pass, m.obt));
                        alert(`${month} mahine ka data fetch ho gaya!`);
                    } else {
                        loadClassBooks();
                        alert(`Student mil gaya. Naye mahine ke marks bhar dein.`);
                    }
                }
            } catch (e) {
                alert("Internet Connection Error! Kripya check karein.");
            }
            document.getElementById('adminStatus').innerText = "";
            document.getElementById('fetchBtn').disabled = false;
        }

        async function saveStudent() {
            let dakhila = document.getElementById('inpDakhila').value;
            let month = document.getElementById('inpMonth').value;
            let name = document.getElementById('inpName').value;
            let className = document.getElementById('inpClass').value;
            
            if(!dakhila || !name || !className) return alert("Dakhila, Name aur Class zaruri hai!");

            let marksData = [];
            let classBlueprint = []; 
            let totalObtained = 0; let grandTotal = 0;

            document.querySelectorAll('.subject-row').forEach(row => {
                let subName = row.querySelector('.sub-name').value;
                let subTot = Number(row.querySelector('.sub-tot').value);
                let subPass = Number(row.querySelector('.sub-pass').value);
                let subObt = row.querySelector('.sub-obt').value;
                if(subName.trim() !== "") {
                    classBlueprint.push({ name: subName, tot: subTot, pass: subPass });
                    if(subObt !== "") {
                        subObt = Number(subObt);
                        marksData.push({ name: subName, tot: subTot, pass: subPass, obt: subObt });
                        totalObtained += subObt; grandTotal += subTot;
                    }
                }
            });

            if(marksData.length === 0) return alert("Kam se kam 1 kitab ke marks daalna zaruri hai!");

            let classDB = JSON.parse(localStorage.getItem('madarsaClassBooks')) || {};
            classDB[className] = classBlueprint;
            localStorage.setItem('madarsaClassBooks', JSON.stringify(classDB));

            // Fetch old record to update, if any
            let student = { dakhila: dakhila, name: name, class: className, photo: document.getElementById('inpPhoto').value || 'https://via.placeholder.com/100?text=Photo', monthlyRecords: {} };
            
            // Backup in Local Storage for Top 10
            let db = JSON.parse(localStorage.getItem('madarsaSmartDB')) || {};
            if(db[dakhila]) student.monthlyRecords = db[dakhila].monthlyRecords;
            student.monthlyRecords[month] = { marks: marksData, totalObtained: totalObtained, grandTotal: grandTotal };
            db[dakhila] = student; 
            localStorage.setItem('madarsaSmartDB', JSON.stringify(db));

            // Push to Internet
            let saveBtn = document.getElementById('saveBtn');
            saveBtn.innerText = "Saving to Internet... ⏳";
            saveBtn.disabled = true;
            
            try {
                await fetch(API_URL, { method: 'POST', body: JSON.stringify({ dakhila: dakhila, record: student }) });
                alert(`${className} ki kitabein aur ${name} ka result Online Saved!`);
                document.getElementById('inpDakhila').value = '';
                document.getElementById('inpName').value = '';
                document.getElementById('subjectsContainer').innerHTML = '';
                document.getElementById('inpClass').value = '';
                addSubjectRow();
            } catch(e) {
                alert("Internet ka masla hai! Data local save ho gaya hai.");
            }
            saveBtn.innerText = "💾 Save Result to Internet";
            saveBtn.disabled = false;
        }

        function loadTop10() {
            let month = document.getElementById('top10Month').value;
            let db = JSON.parse(localStorage.getItem('madarsaSmartDB')) || {};
            let studentsArray = [];
            for(let key in db) {
                if(db[key].monthlyRecords && db[key].monthlyRecords[month]) {
                    studentsArray.push({ dakhila: db[key].dakhila, name: db[key].name, class: db[key].class, record: db[key].monthlyRecords[month] });
                }
            }
            studentsArray.sort((a, b) => b.record.totalObtained - a.record.totalObtained);
            let tbody = document.getElementById('top10Body');
            tbody.innerHTML = '';
            let top10 = studentsArray.slice(0, 10);
            if(top10.length === 0) return tbody.innerHTML = `<tr><td colspan="6" style="color:red;">No result found for ${month}</td></tr>`;
            top10.forEach((st, index) => {
                let percent = st.record.grandTotal > 0 ? ((st.record.totalObtained / st.record.grandTotal) * 100).toFixed(2) : 0;
                tbody.innerHTML += `<tr><td>${index + 1}</td><td>${st.dakhila}</td><td>${st.name}</td><td>${st.class}</td><td>${st.record.totalObtained}</td><td>${percent}%</td></tr>`;
            });
        }
        showSection('adminSection');
    </script>
</body>
</html>
